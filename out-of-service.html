<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Out of service — TIFABO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--tp:#9DB5C5;--ta:#c8dce8;--td:#0f1214;--ts:#161a1d;--tpn:#1c2125;--tb:rgba(157,181,197,0.11);--tr:rgba(157,181,197,0.06);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:Helvetica,Arial,sans-serif;background:var(--td);color:#b8ccd6;display:flex;}
.mono{font-family:'DM Mono',monospace;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#263038;border-radius:3px;}

/* ── SIDEBAR: removed ── */
#sidebar{display:none;}
.ni,.ntt{display:none;}

/* ── MAIN AREA: full width ── */
#main-area{flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden;min-width:0;margin-left:0;}

/* ── TOP BAR ── */
#top-bar{height:48px;background:var(--ts);border-bottom:1px solid var(--tb);display:flex;align-items:center;padding:0 1.5rem;gap:.75rem;flex-shrink:0;}
.tbar-tab{font-size:11px;font-family:'DM Mono',monospace;padding:.3rem .75rem;border-radius:6px;cursor:pointer;color:#304050;border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.tbar-tab:hover{color:var(--tp);background:var(--tr);}
.tbar-tab.active{color:var(--tp);border-color:rgba(157,181,197,.2);background:var(--tr);}

/* ── PAGE CONTAINER: only one page visible at a time ── */
#pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;}
.page.active{display:block;}

/* ── COMMON ── */
.tbtn{background:var(--tp);color:#0f1214;font-weight:600;border:none;cursor:pointer;transition:opacity .18s;font-family:Helvetica,Arial,sans-serif;}
.tbtn:hover{opacity:.84;}
.tghost{background:transparent;border:1px solid rgba(157,181,197,.22);color:var(--ta);cursor:pointer;transition:all .18s;font-family:Helvetica,Arial,sans-serif;}
.tghost:hover{background:var(--tr);border-color:var(--tp);}
.card{background:var(--ts);border:1px solid var(--tb);border-radius:12px;padding:1.25rem;}
.sc{background:var(--ts);border:1px solid var(--tb);border-radius:9px;padding:.9rem;}
.stag{font-size:9px;font-family:'DM Mono',monospace;color:var(--tp);letter-spacing:.15em;margin-bottom:.3rem;}
.stitle{font-size:clamp(1.4rem,2.5vw,1.9rem);font-weight:700;letter-spacing:-.025em;color:#d0e2ec;}
textarea,input[type=text],input[type=password],input[type=url],input[type=email]{background:rgba(12,15,17,.9);border:1px solid var(--tb);border-radius:8px;color:#8aa0ac;padding:.55rem .8rem;width:100%;outline:none;font-family:'DM Mono',monospace;font-size:12px;line-height:1.6;resize:none;transition:border-color .18s;}
textarea:focus,input:focus{border-color:rgba(157,181,197,.3);}
input[type=range]{-webkit-appearance:none;background:transparent;width:100%;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:12px;width:12px;border-radius:50%;background:var(--tp);cursor:pointer;margin-top:-4px;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#263038;border-radius:2px;}
.tw{position:relative;width:38px;height:20px;flex-shrink:0;}
.tw input{opacity:0;width:0;height:0;}
.tt{position:absolute;inset:0;background:#263038;border-radius:10px;cursor:pointer;transition:background .18s;}
.tt::after{content:'';position:absolute;left:2.5px;top:2.5px;width:15px;height:15px;background:#fff;border-radius:50%;transition:transform .18s;}
.tw input:checked+.tt{background:var(--tp);}
.tw input:checked+.tt::after{transform:translateX(18px);}
.dr{background:#d94030;}.dy{background:#e09010;}.dg{background:#25a050;}.dc{background:var(--tp);}
.mo{position:fixed;inset:0;background:rgba(8,11,13,.93);backdrop-filter:blur(8px);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem;overflow-y:auto;}
.mo.open{display:flex;}
.mb{background:var(--tpn);border:1px solid var(--tb);border-radius:15px;width:100%;padding:1.6rem;max-height:90vh;overflow-y:auto;}
@keyframes fadein{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.fi{animation:fadein .25s ease-out both;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.pulse{animation:pulse 2s infinite;}

/* ── PORTFOLIO ── */
.port-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--tb);}
.pcrd{background:var(--ts);padding:1.5rem;cursor:pointer;transition:background .18s;position:relative;overflow:hidden;min-height:210px;display:flex;flex-direction:column;}
.pcrd:hover{background:var(--tpn);}
.pcrd::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--tp);transform:scaleX(0);transform-origin:left;transition:transform .25s;}
.pcrd:hover::before{transform:scaleX(1);}
.ptype{font-size:9px;font-family:'DM Mono',monospace;color:var(--tp);letter-spacing:.12em;margin-bottom:.65rem;display:flex;align-items:center;gap:5px;}
.ptype::before{content:'';width:12px;height:1px;background:var(--tp);}
.ptag{font-size:9px;font-family:'DM Mono',monospace;padding:2px 7px;border:1px solid rgba(157,181,197,.12);border-radius:100px;color:#3d5a68;}
.pfilt{font-size:10px;font-family:'DM Mono',monospace;padding:3px 10px;border:1px solid var(--tb);border-radius:100px;cursor:pointer;color:#304050;transition:all .15s;background:none;}
.pfilt:hover,.pfilt.active{border-color:var(--tp);color:var(--tp);background:var(--tr);}
.cv-item{display:flex;gap:1.1rem;padding:.75rem 0;border-bottom:1px solid var(--tb);}
.cv-year{font-size:9px;font-family:'DM Mono',monospace;color:var(--tp);min-width:76px;padding-top:2px;flex-shrink:0;}
.port-img{width:100%;max-height:200px;object-fit:contain;border-radius:6px;margin-bottom:.75rem;background:transparent;display:block;cursor:zoom-in;}
.port-img-placeholder{width:100%;height:110px;background:var(--tpn);border:1px dashed rgba(157,181,197,.12);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:.75rem;color:#263038;font-size:10px;font-family:'DM Mono',monospace;}

/* ── TOOLS ── */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}
.tcard{background:var(--ts);border:1px solid var(--tb);border-radius:12px;padding:1.5rem;cursor:pointer;transition:all .2s;}
.tcard:hover{border-color:rgba(157,181,197,.26);background:var(--tpn);}
.badge-live{background:rgba(37,160,80,.1);color:#3aaf60;border:1px solid rgba(37,160,80,.2);font-size:9px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:100px;display:inline-flex;align-items:center;gap:4px;}

/* ── WRKASSIST ── */
#wrk-shell{display:flex;height:100%;overflow:hidden;}
#wrk-sidebar{width:220px;background:var(--ts);border-right:1px solid var(--tb);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
#wrk-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.wni{display:flex;align-items:center;gap:8px;padding:.45rem .75rem;border-radius:6px;cursor:pointer;transition:all .14s;color:#304050;font-size:12px;margin:0 .4rem;}
.wni:hover{background:var(--tr);color:#8aa6b5;}
.wni.active{background:rgba(157,181,197,.11);color:var(--tp);}
.wni i{width:13px;font-size:11px;}
.wview{display:none;overflow-y:auto;padding:1.25rem;}
/* active class is NOT used for display — JS manages display exclusively to prevent conflicts */
.cr-item{display:flex;align-items:flex-start;gap:9px;padding:.75rem .85rem;border-radius:8px;border:1px solid var(--tb);background:var(--ts);margin-bottom:6px;cursor:pointer;transition:border-color .18s;}
.cr-item:hover{border-color:rgba(157,181,197,.2);}
.cr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.drop-zone{border:1.5px dashed rgba(157,181,197,.16);border-radius:10px;padding:2rem;text-align:center;cursor:pointer;transition:all .18s;}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--tp);background:rgba(157,181,197,.04);}
#rich-editor{min-height:420px;padding:1.5rem;color:#9ab0bc;font-size:14px;line-height:1.9;outline:none;font-family:'DM Mono',monospace;}
#rich-editor:empty::before{content:'Start writing your assignment here…';color:#263038;font-style:italic;}
.fb-item{padding:.55rem .8rem;border-radius:6px;border-left:2px solid;font-size:10px;line-height:1.65;margin-bottom:5px;font-family:'DM Mono',monospace;}
.fb-r{border-color:#d94030;background:rgba(217,64,48,.05);color:#b06050;}
.fb-y{border-color:#e09010;background:rgba(224,144,16,.05);color:#a07030;}
.fb-g{border-color:#25a050;background:rgba(37,160,80,.05);color:#509060;}
.fb-c{border-color:var(--tp);background:rgba(157,181,197,.05);color:var(--ta);}
.report-cr{display:flex;align-items:center;justify-content:space-between;padding:.55rem .8rem;background:rgba(28,33,37,.7);border-radius:7px;border:1px solid var(--tb);margin-bottom:4px;}

/* ── REFS ── */
.ref-layout{display:grid;grid-template-columns:1fr 300px;gap:1.25rem;}
.ref-entry{padding:.65rem .85rem;background:rgba(12,15,17,.55);border:1px solid var(--tb);border-radius:7px;margin-bottom:5px;font-size:11px;font-family:'DM Mono',monospace;line-height:1.75;color:#607888;}
.ref-num{color:var(--tp);font-weight:500;margin-right:5px;}
.intext-entry{font-size:11px;padding:.4rem .7rem;background:rgba(157,181,197,.04);border:1px solid var(--tb);border-radius:6px;margin-bottom:3px;color:#507080;font-family:'DM Mono',monospace;cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:space-between;}
.intext-entry:hover{background:rgba(157,181,197,.09);}
.rgroup-btn{font-size:10px;font-family:'DM Mono',monospace;padding:3px 8px;border:1px solid var(--tb);border-radius:5px;cursor:pointer;background:none;color:#304050;transition:all .12s;width:100%;text-align:left;}
.rgroup-btn:hover{border-color:var(--tp);color:var(--tp);background:var(--tr);}
#ref-prog-wrap{height:3px;background:var(--tb);border-radius:2px;margin-bottom:.65rem;overflow:hidden;display:none;}
#ref-prog-bar{height:100%;background:var(--tp);border-radius:2px;width:0%;transition:width .2s ease;}

/* ── ADMIN PANEL ── */
#admin-panel{position:fixed;inset:0;z-index:9999;background:rgba(5,7,9,.97);display:none;flex-direction:column;}
#admin-panel.open{display:flex;}
.admin-bar{background:#090c0e;border-bottom:1px solid var(--tb);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.75rem;flex-shrink:0;}
.admin-body{flex:1;overflow-y:auto;padding:1.5rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;align-content:start;}
.admin-card{background:var(--ts);border:1px solid var(--tb);border-radius:10px;padding:1rem;}
.admin-card h3{font-size:9px;font-family:'DM Mono',monospace;color:var(--tp);letter-spacing:.14em;margin-bottom:.75rem;}
.afl{font-size:9px;font-family:'DM Mono',monospace;color:#304050;display:block;margin-bottom:3px;}

/* ── TOUR ── */
#tour-overlay{position:fixed;inset:0;z-index:800;pointer-events:none;display:none;}
#tour-overlay.active{display:block;}
.tour-bg{position:fixed;inset:0;background:rgba(7,10,12,.85);z-index:801;pointer-events:all;}
.tour-spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(7,10,12,.85);z-index:802;transition:all .3s ease;pointer-events:none;border:1.5px solid var(--tp);}
.tour-card{position:fixed;z-index:803;background:var(--tpn);border:1px solid rgba(157,181,197,.22);border-radius:12px;padding:1.1rem 1.25rem;width:265px;pointer-events:all;}
.tour-dot{width:5px;height:5px;border-radius:50%;background:#263038;transition:all .2s;cursor:pointer;flex-shrink:0;}
.tour-dot.active{background:var(--tp);width:14px;border-radius:3px;}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  #sidebar{display:none;}
  #top-bar{overflow-x:auto;}
  .ref-layout{grid-template-columns:1fr!important;}
  .admin-body{grid-template-columns:1fr 1fr!important;}
  .port-grid{grid-template-columns:1fr 1fr!important;}
  .dash-stats-grid{grid-template-columns:1fr 1fr!important;}
  .dash-charts-grid{grid-template-columns:1fr!important;}
  .dash-charts-collapse>summary{display:block!important;}
}
@media(max-width:820px){
  #cv-preview-grid{grid-template-columns:1fr!important;gap:1.5rem!important;}
  #cv-preview-card{max-width:420px;margin:0 auto;}
}
@media(max-width:600px){
  /* Hero: smaller title, tighter padding */
  #port-hero{padding:1.75rem 1.1rem 1rem!important;}
  #portfolio-title{font-size:1.65rem!important;letter-spacing:-.02em!important;}
  #portfolio-subtitle{font-size:.8rem!important;}
  /* Horizontal padding everywhere */
  #port-filter-bar{padding:.7rem 1.1rem!important;}
  #port-grid{padding:1.1rem!important;gap:.85rem!important;}
  #notice-board-wrap{padding:.55rem 1.1rem!important;}
  /* Project cards sized for phone */
  .pcrd{min-width:225px!important;max-width:255px!important;}
  /* Stop text clipping */
  .pcrd .cmd-title,.pcrd div{word-break:break-word;overflow-wrap:anywhere;}
  /* CV + Experience full width */
  #cv-preview-grid{grid-template-columns:1fr!important;}
  #cv-preview-card{max-width:100%!important;}
  /* Top bar scrollable, no squash */
  #top-bar{padding:0 .75rem!important;gap:.4rem!important;}
  .tbar-tab{font-size:10px!important;padding:.3rem .55rem!important;white-space:nowrap;}
  /* Section padding */
  .page>div[style*="padding:2rem"]{padding:1.25rem 1.1rem!important;}
}
@media(max-width:400px){
  #portfolio-title{font-size:1.4rem!important;}
  .pcrd{min-width:200px!important;}
}
@media(max-width:600px){
  .admin-body{grid-template-columns:1fr!important;}
  .tools-grid{grid-template-columns:1fr!important;}
  .port-grid{grid-template-columns:1fr!important;}
  #wrk-shell{flex-direction:column;}
  #wrk-sidebar{width:100%;max-height:120px;border-right:none;border-bottom:1px solid var(--tb);overflow-y:auto;}
  #wrk-sidebar-crit{display:none!important;}
  .dash-stats-grid{grid-template-columns:1fr 1fr!important;}
  .dash-charts-collapse>summary{display:block!important;}
}
details.dash-charts-collapse>summary{list-style:none;font-size:10px;font-family:'DM Mono',monospace;color:var(--tp);cursor:pointer;padding:.3rem 0 .6rem;user-select:none;display:none;}
details.dash-charts-collapse>summary::-webkit-details-marker{display:none;}
details.dash-charts-collapse[open]>summary::before{content:'▾ ';}
details.dash-charts-collapse:not([open])>summary::before{content:'▸ ';}
canvas{max-height:180px;}


/* Hero expand on scroll-up */
#port-hero.hero-expanded{min-height:46vh;display:flex;flex-direction:column;justify-content:center;padding-top:3.5rem!important;padding-bottom:2.5rem!important;}
#port-hero.hero-expanded #portfolio-title{font-size:3rem;}
#port-hero #portfolio-title{transition:font-size .45s cubic-bezier(.4,0,.2,1);}
@media(max-width:600px){
  #port-hero.hero-expanded{min-height:38vh;padding-top:2.25rem!important;padding-bottom:1.5rem!important;}
  #port-hero.hero-expanded #portfolio-title{font-size:2rem!important;}
}
@media(prefers-reduced-motion:reduce){
  #port-hero,#port-hero #portfolio-title{transition:none!important;}
}
</style>
<style>
html,body{height:100%;overflow:auto;}
body{display:flex;flex-direction:column;min-height:100vh;}
#oos-bar{height:46px;background:var(--ts);border-bottom:1px solid var(--tb);display:flex;align-items:center;gap:.75rem;padding:0 1.25rem;flex-shrink:0;}
.oos-logo{font-size:11px;font-family:'DM Mono',monospace;color:var(--tp);letter-spacing:.12em;}
.oos-sep{width:1px;height:16px;background:var(--tb);}
.oos-back{font-size:10px;font-family:'DM Mono',monospace;color:#35505e;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .15s;}
.oos-back:hover{color:var(--tp);}
#oos-main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;}
.oos-card{max-width:520px;width:100%;text-align:center;}
.oos-icon{width:64px;height:64px;margin:0 auto 1.5rem;border-radius:16px;background:rgba(224,144,16,.08);border:1px solid rgba(224,144,16,.2);display:flex;align-items:center;justify-content:center;}
.oos-icon i{font-size:26px;color:#e09010;}
.oos-tag{font-size:9px;font-family:'DM Mono',monospace;color:#e09010;letter-spacing:.18em;margin-bottom:.65rem;}
.oos-title{font-size:2rem;font-weight:700;letter-spacing:-.03em;color:#d0e2ec;margin-bottom:.65rem;line-height:1.15;}
.oos-desc{font-size:.9rem;color:#35505e;line-height:1.7;margin-bottom:1.75rem;}
.oos-tool{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-family:'DM Mono',monospace;color:var(--tp);background:rgba(157,181,197,.06);border:1px solid var(--tb);padding:4px 11px;border-radius:20px;margin-bottom:1.5rem;}
.oos-actions{display:flex;gap:.65rem;justify-content:center;flex-wrap:wrap;}
.oos-btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'DM Mono',monospace;padding:.5rem 1.15rem;border-radius:7px;text-decoration:none;transition:all .18s;cursor:pointer;}
.oos-btn-p{background:var(--tp);color:#0f1214;border:none;}
.oos-btn-p:hover{opacity:.85;}
.oos-btn-g{background:transparent;color:#507080;border:1px solid var(--tb);}
.oos-btn-g:hover{border-color:var(--tp);color:var(--tp);}
@media(max-width:600px){
  .oos-title{font-size:1.5rem;}
  .oos-desc{font-size:.84rem;}
  #oos-main{padding:1.5rem 1.1rem;}
}
</style>
</head>
<body>
<div id="oos-bar">
  <div class="oos-logo">TIFABO</div>
  <div class="oos-sep"></div>
  <a class="oos-back" href="index.html"><i class="fas fa-arrow-left" style="font-size:9px;"></i> Portfolio</a>
</div>

<div id="oos-main">
  <div class="oos-card">
    <div class="oos-icon"><i class="fas fa-screwdriver-wrench"></i></div>
    <div class="oos-tag">TEMPORARILY UNAVAILABLE</div>
    <h1 class="oos-title">This tool is out of service</h1>
    <div class="oos-tool" id="oos-tool-name" style="display:none;"><i class="fas fa-wrench" style="font-size:9px;"></i><span></span></div>
    <p class="oos-desc">
      This tool is currently undergoing maintenance and has been taken offline while it's rebuilt.
      The rest of the portfolio is unaffected. Check back soon.
    </p>
    <div class="oos-actions">
      <a class="oos-btn oos-btn-p" href="index.html"><i class="fas fa-arrow-left" style="font-size:9px;"></i>Back to portfolio</a>
      <a class="oos-btn oos-btn-g" href="cli-guide.html"><i class="fas fa-terminal" style="font-size:9px;"></i>Try CLI Guide</a>
    </div>
  </div>
</div>

<script>
// Show which tool was requested, via ?tool=WRKASSIST
(function(){
  const params=new URLSearchParams(window.location.search);
  const tool=params.get('tool');
  if(tool){
    const el=document.getElementById('oos-tool-name');
    if(el){el.style.display='inline-flex';el.querySelector('span').textContent=tool;}
  }
})();
</script>
</body>
</html>
